name: Auto Merge

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  check_suite:
    types: [completed]
  workflow_run:
    workflows: ["CI/CD Pipeline"]
    types:
      - completed

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    name: Auto Merge PR
    runs-on: ubuntu-latest
    steps:
      - name: Get PR number
        id: pr-number
        uses: actions/github-script@v7
        with:
          script: |
            let prNumber;
            let skip = false;
            const eventName = process.env.GITHUB_EVENT_NAME || github.event_name || context.eventName;
            
            console.log(`=== AUTO MERGE DEBUG ===`);
            console.log(`Event name: ${eventName}`);
            console.log(`Context eventName: ${context.eventName}`);
            console.log(`GitHub event_name: ${github.event_name}`);
            
            if (eventName === 'workflow_run') {
              console.log('Event: workflow_run');
              const workflowRun = github.event.workflow_run || {};
              const headBranch = workflowRun.head_branch;
              const headSha = workflowRun.head_sha;
              const conclusion = workflowRun.conclusion;
              
              console.log(`Head branch: ${headBranch || 'N/A'}`);
              console.log(`Head SHA: ${headSha || 'N/A'}`);
              console.log(`Conclusion: ${conclusion || 'N/A'}`);
              
              // NO ejecutar si no es success
              if (conclusion !== 'success') {
                console.log(`Workflow run conclusion is ${conclusion}, skipping`);
                skip = true;
              }
              // NO ejecutar si es un merge commit
              else if (workflowRun.head_commit?.message?.includes('Merge pull request')) {
                console.log('This is a merge commit, skipping auto-merge');
                skip = true;
              }
              // Buscar PRs
              else if (!headBranch) {
                console.log('No head branch found in workflow_run event');
                skip = true;
              } else {
                console.log(`Searching for PRs with head: castilla204:${headBranch}`);
                
                // Intentar buscar por branch
                let prs = [];
                try {
                  const response = await github.rest.pulls.list({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    state: 'open',
                    head: `${context.repo.owner}:${headBranch}`,
                  });
                  prs = response.data;
                } catch (error) {
                  console.log(`Error searching PRs by branch: ${error.message}`);
                }
                
                // Si no se encuentra, buscar por SHA
                if (prs.length === 0 && headSha) {
                  console.log(`No PRs found by branch, searching by SHA: ${headSha}`);
                  try {
                    const allPRs = await github.rest.pulls.list({
                      owner: context.repo.owner,
                      repo: context.repo.repo,
                      state: 'open',
                    });
                    prs = allPRs.data.filter(pr => pr.head.sha === headSha);
                  } catch (error) {
                    console.log(`Error searching PRs by SHA: ${error.message}`);
                  }
                }
                
                console.log(`Found ${prs.length} open PR(s)`);
                
                if (prs.length === 0) {
                  console.log('No PR found for this workflow run, skipping');
                  skip = true;
                } else {
                  prNumber = prs[0].number;
                  console.log(`Found PR #${prNumber}: ${prs[0].title}`);
                }
              }
            } else if (eventName === 'pull_request') {
              prNumber = context.issue?.number || github.event.pull_request?.number || context.payload?.pull_request?.number;
              console.log(`Event: pull_request, PR #${prNumber}`);
            } else if (eventName === 'check_suite') {
              const checkSuite = github.event.check_suite || {};
              const headSha = checkSuite.head_sha;
              console.log(`Event: check_suite, Head SHA: ${headSha || 'N/A'}`);
              
              if (headSha && typeof headSha === 'string') {
                // Buscar todos los PRs abiertos y filtrar por SHA
                const { data: allPRs } = await github.rest.pulls.list({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  state: 'open',
                });
                const matchingPR = allPRs.find(pr => pr.head.sha === headSha);
                if (matchingPR) {
                  prNumber = matchingPR.number;
                  console.log(`Found PR #${prNumber} from check_suite with SHA ${headSha}`);
                } else {
                  console.log(`No PR found for check_suite with SHA ${headSha}`);
                  skip = true;
                }
              } else {
                console.log('No head_sha found in check_suite event');
                skip = true;
              }
            } else {
              console.log(`Event: ${eventName}, skipping - not a supported event`);
              skip = true;
            }
            
            if (skip || !prNumber) {
              console.log('=== SKIPPING AUTO MERGE ===');
              core.setOutput('skip', 'true');
              core.setOutput('pr-number', '');
            } else {
              console.log(`=== PROCEEDING WITH PR #${prNumber} ===`);
              core.setOutput('pr-number', prNumber.toString());
              core.setOutput('skip', 'false');
            }
            
            return prNumber || null;

      - name: Get PR info
        id: pr-info
        if: steps.pr-number.outputs.skip != 'true' && steps.pr-number.outputs['pr-number'] != ''
        uses: actions/github-script@v7
        with:
          script: |
            const prNumberStr = '${{ steps.pr-number.outputs.pr-number }}';
            
            if (!prNumberStr || prNumberStr === '') {
              console.log('PR number is empty, skipping');
              core.setOutput('skip', 'true');
              return;
            }
            
            const prNumber = parseInt(prNumberStr);
            
            if (!prNumber || isNaN(prNumber)) {
              console.log(`Invalid PR number: ${prNumberStr}, skipping`);
              core.setOutput('skip', 'true');
              return;
            }
            
            console.log(`Getting info for PR #${prNumber}`);
            
            const { data: pr } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: prNumber,
            });
            
            console.log(`PR #${prNumber} details:`);
            console.log(`  State: ${pr.state}`);
            console.log(`  User: ${pr.user.login} (${pr.user.type})`);
            console.log(`  Draft: ${pr.draft}`);
            console.log(`  Mergeable: ${pr.mergeable}`);
            console.log(`  Mergeable state: ${pr.mergeable_state}`);
            
            // Verificar que el PR sigue abierto
            if (pr.state !== 'open') {
              console.log(`PR #${prNumber} is ${pr.state}, skipping`);
              core.setOutput('skip', 'true');
              return;
            }
            
            // Verificar que es un bot
            if (pr.user.type !== 'Bot' && !pr.user.login.includes('bot')) {
              console.log('PR is not from a bot, skipping auto-merge');
              core.setOutput('skip', 'true');
              return;
            }
            
            core.setOutput('mergeable', pr.mergeable);
            core.setOutput('mergeable_state', pr.mergeable_state);
            core.setOutput('draft', pr.draft);
            core.setOutput('head-sha', pr.head.sha);
            core.setOutput('skip', 'false');
            
            return {
              mergeable: pr.mergeable,
              mergeable_state: pr.mergeable_state,
              draft: pr.draft,
              head_sha: pr.head.sha
            };

      - name: Wait for all checks to pass
        if: steps.pr-info.outputs.skip != 'true' && steps.pr-info.outputs.draft == 'false' && steps.pr-info.outputs.mergeable == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const prNumberStr = '${{ steps.pr-number.outputs.pr-number }}';
            const prNumber = parseInt(prNumberStr);
            const headSha = '${{ steps.pr-info.outputs.head-sha }}';
            const maxWait = 300; // 5 minutos (reducido para PRs que ya pasaron CI/CD)
            const checkInterval = 10;
            let waited = 0;

            console.log(`Waiting for checks to pass for PR #${prNumber} (SHA: ${headSha})`);

            while (waited < maxWait) {
              // Verificar estado combinado
              const { data: status } = await github.rest.repos.getCombinedStatusForRef({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: headSha,
              });

              // Verificar checks
              const { data: checks } = await github.rest.checks.listForRef({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: headSha,
              });

              // Verificar PR
              const { data: pr } = await github.rest.pulls.get({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: prNumber,
              });

              // Si el PR ya está cerrado, salir
              if (pr.state !== 'open') {
                console.log(`PR #${prNumber} is ${pr.state}, stopping`);
                core.setOutput('skip', 'true');
                return;
              }

              const allChecksPassed = 
                status.state === 'success' &&
                checks.check_runs.every(check => 
                  check.status === 'completed' && 
                  (check.conclusion === 'success' || check.conclusion === 'skipped')
                ) &&
                pr.mergeable &&
                !pr.draft;

              if (allChecksPassed) {
                console.log('✅ All checks passed, ready to merge');
                break;
              }

              if (status.state === 'failure' || pr.mergeable === false) {
                console.log(`Checks failed or PR not mergeable. Status: ${status.state}, Mergeable: ${pr.mergeable}`);
                core.setFailed('Checks failed or PR is not mergeable');
                return;
              }

              console.log(`⏳ Waiting... (${waited}s/${maxWait}s) - Status: ${status.state}, Checks: ${checks.check_runs.length}`);
              await new Promise(resolve => setTimeout(resolve, checkInterval * 1000));
              waited += checkInterval;
            }

            if (waited >= maxWait) {
              core.setFailed('Timeout waiting for checks');
              return;
            }

      - name: Merge PR
        if: steps.pr-info.outputs.skip != 'true' && steps.pr-info.outputs.draft == 'false' && steps.pr-info.outputs.mergeable == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const prNumberStr = '${{ steps.pr-number.outputs.pr-number }}';
            const prNumber = parseInt(prNumberStr);
            
            console.log(`=== ATTEMPTING TO MERGE PR #${prNumber} ===`);
            
            // Verificar una última vez que el PR sigue abierto
            const { data: pr } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: prNumber,
            });
            
            if (pr.state !== 'open') {
              console.log(`PR #${prNumber} is already ${pr.state}, skipping merge`);
              return;
            }
            
            try {
              const result = await github.rest.pulls.merge({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: prNumber,
                merge_method: 'squash',
                commit_title: `${pr.title} (#${prNumber})`,
              });
              
              console.log('✅ PR merged successfully');
              console.log(`   SHA: ${result.data.sha}`);
            } catch (error) {
              console.error('Error merging PR:', error.message);
              console.error('Error status:', error.status);
              if (error.status === 405) {
                console.log('PR cannot be merged - may need manual intervention');
                core.setFailed('PR cannot be merged');
              } else {
                throw error;
              }
            }
