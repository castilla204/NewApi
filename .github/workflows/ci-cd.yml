name: CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        run: dotnet restore newApi.csproj

      - name: Build
        run: dotnet build newApi.csproj --configuration Release --no-restore

      - name: Run tests
        run: dotnet test --no-build --configuration Release --verbosity normal || echo "No tests found"
        continue-on-error: true

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: build-and-test
    permissions:
      contents: write
      security-events: write
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Run Trivy vulnerability scanner (table format)
        uses: aquasecurity/trivy-action@0.33.1
        id: trivy-scan
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'table'
          severity: 'CRITICAL,HIGH'
          exit-code: '1'
          scanners: 'vuln'
          skip-files: 'Program.cs'

  docker-build:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    needs: [build-and-test, security-scan]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: write

    
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            erizo9/newapi:latest
            erizo9/newapi:${{ github.sha }}
          cache-from: type=registry,ref=erizo9/newapi:buildcache
          cache-to: type=registry,ref=erizo9/newapi:buildcache,mode=max
      - name: Get image digest
        id: image-digest
        run: |
          # Obtener el digest de la imagen latest
          IMAGE_TAG="erizo9/newapi:latest"
          DIGEST=$(docker buildx imagetools inspect $IMAGE_TAG --format '{{json .}}' | jq -r '.manifest.digest')
          
          # Si no empieza con sha256:, agregarlo
          if [[ ! "$DIGEST" =~ ^sha256: ]]; then
            DIGEST="sha256:$DIGEST"
          fi
          
          echo "digest=$DIGEST" >> $GITHUB_OUTPUT
          echo "Image digest: $DIGEST"

      - name: Update deployment.yaml
        if: github.ref == 'refs/heads/main'
        run: |
          DIGEST="${{ steps.image-digest.outputs.digest }}"
          echo "Updating deployment.yaml with digest: $DIGEST"
          
          # Actualizar la línea de image en deployment.yaml
          sed -i "s|image: erizo9/newapi@sha256:[a-f0-9]*|image: erizo9/newapi@$DIGEST|g" k8s/deployment.yaml
          
          # Verificar
          if grep -q "$DIGEST" k8s/deployment.yaml; then
            echo "✅ deployment.yaml actualizado"
            grep "image:" k8s/deployment.yaml
          else
            echo "❌ Error actualizando deployment.yaml"
            exit 1
          fi

      - name: Commit and push deployment update
        if: github.ref == 'refs/heads/main'
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: 'chore: Update deployment image digest [skip ci]'
          file_pattern: 'k8s/deployment.yaml'
          skip_dirty_check: true

