apiVersion: apps/v1
kind: Deployment
metadata:
  name: new-api
  namespace: default
  labels:
    app: new-api
    version: v1
    managed-by: argocd
  annotations:
    deployment.kubernetes.io/revision-history-limit: "10"
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: new-api
  template:
    metadata:
      labels:
        app: new-api
        version: v1
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      imagePullSecrets:
      - name: regcred
      containers:
      - name: new-api
        image: erizo9/newapi:latest
        imagePullPolicy: Always
        ports:
        - name: http
          containerPort: 7124
          protocol: TCP
        env:
        - name: RABBITMQ_HOSTNAME
          value: "rabbitmq-svc"
        - name: RABBITMQ_PORT
          value: "5672"
        - name: RABBITMQ_USERNAME
          value: "admin"
        - name: RABBITMQ_PASSWORD
          valueFrom:
            secretKeyRef:
              name: newapi-secrets
              key: rabbitmq-password
        - name: GOOGLE_APPLICATION_CREDENTIALS
          value: "/etc/credentials/cloudcredential.json"
        - name: ASPNETCORE_ENVIRONMENT
          value: "Production"
        - name: DOTNET_SYSTEM_NET_DISABLEIPV6
          value: "1"
        - name: GRPC_VERBOSITY
          value: "ERROR"
        - name: GRPC_TRACE
          value: ""
        - name: POSTGRES_HOST
          value: "postgres-svc"
        - name: POSTGRES_PORT
          value: "5432"
        resources:
          requests:
            memory: "256Mi"
            cpu: "200m"
          limits:
            memory: "1Gi"
            cpu: "1000m"
        livenessProbe:
          httpGet:
            path: /health
            port: 7124
          initialDelaySeconds: 60
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health
            port: 7124
          initialDelaySeconds: 30
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: false
          capabilities:
            drop:
            - ALL
        volumeMounts:
        - name: credentials-volume
          mountPath: "/etc/credentials"
          readOnly: true
      volumes:
      - name: credentials-volume
        secret:
          secretName: newapi-credentials
---
apiVersion: v1
kind: Service
metadata:
  name: new-api-svc
  namespace: default
  labels:
    app: new-api
    managed-by: argocd
spec:
  type: ClusterIP
  ports:
  - name: http
    port: 80
    targetPort: 7124
    protocol: TCP
  selector:
    app: new-api
  sessionAffinity: None
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: new-api-hpa
  namespace: default
  labels:
    app: new-api
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: new-api
  minReplicas: 2
  maxReplicas: 10
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
      - type: Percent
        value: 50
        periodSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
      - type: Percent
        value: 100
        periodSeconds: 30
      - type: Pods
        value: 2
        periodSeconds: 30
      selectPolicy: Max
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: new-api-pdb
  namespace: default
  labels:
    app: new-api
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: new-api
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: new-api-ingress
  namespace: default
  labels:
    app: new-api
    managed-by: argocd
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
    nginx.ingress.kubernetes.io/proxy-connect-timeout: "60"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "60"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "60"
    nginx.ingress.kubernetes.io/rate-limit: "200"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
spec:
  ingressClassName: nginx
  rules:
  - host: api.atrapo.io
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: new-api-svc
            port:
              number: 80
  tls:
  - hosts:
    - api.atrapo.io
    secretName: new-api-ssl
