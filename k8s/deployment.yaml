apiVersion: apps/v1
kind: Deployment
metadata:
  name: new-api
  namespace: default
spec:
  replicas: 2
  selector:
    matchLabels:
      app: new-api
  template:
    metadata:
      labels:
        app: new-api
    spec:
      # 👇 ¡LA LÍNEA CRÍTICA AÑADIDA AQUÍ!
      imagePullSecrets:
      - name: regcred 
      # -----------------------------------
      containers:
      - name: new-api
        image: erizo9/newapi:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 7124
        env:
        - name: RABBITMQ_HOSTNAME
          value: "rabbitmq-svc"
        - name: RABBITMQ_PORT
          value: "5672"
        - name: RABBITMQ_USERNAME
          value: "admin"
          # ... (El resto de env y mounts)
        - name: RABBITMQ_PASSWORD
          value: "Pedrohabo1//"
        - name: GOOGLE_APPLICATION_CREDENTIALS
          value: "/etc/credentials/cloudcredential.json"
        - name: ASPNETCORE_ENVIRONMENT
          value: "Production"
        volumeMounts:
        - name: credentials-volume
          mountPath: "/etc/credentials"
          readOnly: true
      volumes:
      - name: credentials-volume
        secret:
          secretName: newapi-credentials
---
apiVersion: v1
kind: Service
metadata:
  name: new-api-svc
  namespace: default
spec:
  ports:
  - port: 80
    targetPort: 7124
  selector:
    app: new-api
  type: ClusterIP
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: new-api-hpa
  namespace: default
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: new-api
  minReplicas: 2
  maxReplicas: 10
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: new-api-ingress
  namespace: default
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
spec:
  ingressClassName: nginx
  rules:
  - host: api.atrapo.io
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: new-api-svc
            port:
              number: 80
  tls:
  - hosts:
    - api.atrapo.io
    secretName: new-api-ssl
