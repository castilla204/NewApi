# Anotaciones de ArgoCD Image Updater para react-web
# Estas anotaciones deben agregarse a la Application de ArgoCD

apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: react-web
  namespace: argocd
  annotations:
    # Configuración de Image Updater
    argocd-image-updater.argoproj.io/image-list: react-web=erizo9/reactweb
    argocd-image-updater.argoproj.io/react-web.update-strategy: semver
    argocd-image-updater.argoproj.io/react-web.allow-tags: "regexp:^v?[0-9]+\\.[0-9]+\\.[0-9]+$"
    argocd-image-updater.argoproj.io/react-web.ignore-tags: latest,dev,test
    argocd-image-updater.argoproj.io/write-back-method: git
    argocd-image-updater.argoproj.io/git-branch: main

