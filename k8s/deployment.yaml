apiVersion: apps/v1
kind: Deployment
metadata:
  name: new-api
  namespace: default
  labels:
    app: new-api
    version: v1
    managed-by: argocd
  annotations:
    deployment.kubernetes.io/revision-history-limit: "10"
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: new-api
  template:
    metadata:
      labels:
        app: new-api
        version: v1
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      imagePullSecrets:
      volumes:
      - name: google-credentials
        secret:
          secretName: newapi-credentials
      - name: regcred
      containers:
      - name: new-api
        image: erizo9/newapi@sha256:efadf345398a91d8cb3cdd66070a653b346d078ed6d7cec790c3bf24aac86785
        imagePullPolicy: Always
        ports:
        - name: http
          containerPort: 7124
          protocol: TCP
        env:
        # RabbitMQ - valores directos para servicios internos
        - name: RABBITMQ_HOSTNAME
          value: "rabbitmq-svc"
        - name: RABBITMQ_PORT
          value: "5672"
        - name: RABBITMQ_USERNAME
          value: "admin"
        - name: RABBITMQ_PASSWORD
          valueFrom:
            secretKeyRef:
              name: newapi-secrets
              key: rabbitmq-password
        
        # Configuración de .NET
        - name: ASPNETCORE_ENVIRONMENT
          value: "Production"
        - name: GRPC_VERBOSITY
          value: "ERROR"
        - name: GRPC_TRACE
          value: ""
        
        # PostgreSQL - TODO desde Secret sincronizado por ESO
        - name: POSTGRES_HOST
          valueFrom:
            secretKeyRef:
              name: newapi-secrets
              key: postgres-host
        - name: POSTGRES_PORT
          valueFrom:
            secretKeyRef:
              name: newapi-secrets
              key: postgres-port
        - name: POSTGRES_USERNAME
          valueFrom:
            secretKeyRef:
              name: newapi-secrets
              key: postgres-username
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: newapi-secrets
              key: postgres-password
        - name: POSTGRES_DATABASE
          valueFrom:
            secretKeyRef:
              name: newapi-secrets
              key: postgres-database
        
        # JWT - desde Secret sincronizado por ESO
        - name: JWT_KEY
          valueFrom:
            secretKeyRef:
              name: newapi-secrets
              key: jwt-key
        - name: JWT_ISSUER
          valueFrom:
            secretKeyRef:
              name: newapi-secrets
              key: jwt-issuer
        - name: JWT_AUDIENCE
          valueFrom:
            secretKeyRef:
              name: newapi-secrets
              key: jwt-audience
        
        # Google OAuth - desde Secret sincronizado por ESO
        - name: GOOGLE_CLIENT_IDS
          valueFrom:
            secretKeyRef:
              name: newapi-secrets
              key: google-client-ids
        
        # OpenAI - desde Secret sincronizado por ESO
        - name: OPENAI_API_KEY
        
        # Google Cloud Credentials
        - name: GOOGLE_APPLICATION_CREDENTIALS
          value: "/etc/google/cloudcredential.json"
        
        # MFA Encryption Key
        - name: Mfa:EncryptionKey
          valueFrom:
            secretKeyRef:
              name: newapi-secrets
              key: mfa-encryption-key
          valueFrom:
        
        # Google Cloud Credentials
        - name: GOOGLE_APPLICATION_CREDENTIALS
          value: "/etc/google/cloudcredential.json"
        
        # MFA Encryption Key
        - name: Mfa:EncryptionKey
          valueFrom:
            secretKeyRef:
              name: newapi-secrets
              key: mfa-encryption-key
            secretKeyRef:
        
        # Google Cloud Credentials
        - name: GOOGLE_APPLICATION_CREDENTIALS
          value: "/etc/google/cloudcredential.json"
        
        # MFA Encryption Key
        - name: Mfa:EncryptionKey
          valueFrom:
            secretKeyRef:
              name: newapi-secrets
              key: mfa-encryption-key
              name: newapi-secrets
        
        # Google Cloud Credentials
        - name: GOOGLE_APPLICATION_CREDENTIALS
          value: "/etc/google/cloudcredential.json"
        
        # MFA Encryption Key
        - name: Mfa:EncryptionKey
          valueFrom:
            secretKeyRef:
              name: newapi-secrets
              key: mfa-encryption-key
              key: openai-api-key
        
        # Google Cloud Credentials
        - name: GOOGLE_APPLICATION_CREDENTIALS
          value: "/etc/google/cloudcredential.json"
        
        # MFA Encryption Key
        - name: Mfa:EncryptionKey
          valueFrom:
            secretKeyRef:
              name: newapi-secrets
              key: mfa-encryption-key
        
        # Email - desde Secret sincronizado por ESO
        - name: EMAIL_FROM_EMAIL
          valueFrom:
            secretKeyRef:
              name: newapi-secrets
              key: email-from-email
        - name: EMAIL_FROM_NAME
          valueFrom:
            secretKeyRef:
              name: newapi-secrets
              key: email-from-name
        - name: EMAIL_SMTP_HOST
          valueFrom:
            secretKeyRef:
              name: newapi-secrets
              key: email-smtp-host
        - name: EMAIL_SMTP_PORT
          valueFrom:
            secretKeyRef:
              name: newapi-secrets
              key: email-smtp-port
        - name: EMAIL_SMTP_USERNAME
          valueFrom:
            secretKeyRef:
              name: newapi-secrets
              key: email-smtp-username
        - name: EMAIL_SMTP_PASSWORD
          valueFrom:
            secretKeyRef:
              name: newapi-secrets
              key: email-smtp-password
        
        # Stripe - desde Secret sincronizado por ESO
        - name: STRIPE_SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: newapi-secrets
              key: stripe-secret-key
        - name: STRIPE_WEBHOOK_SECRET
          valueFrom:
            secretKeyRef:
              name: newapi-secrets
              key: stripe-webhook-secret
        - name: STRIPE_GENERAL_WEBHOOK_SECRET
          valueFrom:
            secretKeyRef:
              name: newapi-secrets
              key: stripe-general-webhook-secret
        
        # Twilio - desde Secret sincronizado por ESO
        - name: TWILIO_ACCOUNT_SID
          valueFrom:
            secretKeyRef:
              name: newapi-secrets
              key: twilio-account-sid
        - name: TWILIO_AUTH_TOKEN
          valueFrom:
            secretKeyRef:
              name: newapi-secrets
              key: twilio-auth-token
        - name: TWILIO_VERIFICATION_SERVICE_SID
          valueFrom:
            secretKeyRef:
              name: newapi-secrets
              key: twilio-verification-service-sid
        volumeMounts:
        - name: google-credentials
          mountPath: /etc/google
          readOnly: true
        resources:
          requests:
            memory: "256Mi"
            cpu: "50m"
          limits:
            memory: "512Mi"
            cpu: "2000m"
        livenessProbe:
          httpGet:
            path: /health
            port: 7124
          initialDelaySeconds: 60
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health
            port: 7124
          initialDelaySeconds: 30
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: false
          capabilities:
            drop:
            - ALL
---
apiVersion: v1
kind: Service
metadata:
  name: new-api-svc
  namespace: default
  labels:
    app: new-api
    managed-by: argocd
spec:
  type: ClusterIP
  ports:
  - name: http
    port: 80
    targetPort: 7124
    protocol: TCP
  selector:
    app: new-api
  sessionAffinity: None
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: new-api-hpa
  namespace: default
  labels:
    app: new-api
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: new-api
  minReplicas: 2
  maxReplicas: 10
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
      - type: Percent
        value: 50
        periodSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
      - type: Percent
        value: 100
        periodSeconds: 30
      - type: Pods
        value: 2
        periodSeconds: 30
      selectPolicy: Max
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: new-api-pdb
  namespace: default
  labels:
    app: new-api
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: new-api
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: new-api-ingress
  namespace: default
  labels:
    app: new-api
    managed-by: argocd
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
    nginx.ingress.kubernetes.io/proxy-connect-timeout: "60"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "60"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "60"
    nginx.ingress.kubernetes.io/rate-limit: "200"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
spec:
  ingressClassName: nginx
  rules:
  - host: api.atrapo.io
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: new-api-svc
            port:
              number: 80
  tls:
  - hosts:
    - api.atrapo.io
    secretName: new-api-ssl

