apiVersion: apps/v1
kind: Deployment
metadata:
  name: new-api
  namespace: default
spec:
  replicas: 2
  selector:
    matchLabels:
      app: new-api
  template:
    metadata:
      labels:
        app: new-api
    spec:
      containers:
      - name: new-api
        image: erizo9/newapi:latest
        ports:
        - containerPort: 7124  # Puerto real de la app
        env:
        - name: GOOGLE_APPLICATION_CREDENTIALS
          value: "/etc/credentials/cloudcredential.json"
        volumeMounts:
        - name: credentials-volume
          mountPath: "/etc/credentials"
          readOnly: true
      volumes:
      - name: credentials-volume
        secret:
          secretName: newapi-credentials

---
apiVersion: v1
kind: Service
metadata:
  name: new-api-svc
  namespace: default
spec:
  ports:
  - port: 80  # Puerto externo del servicio
    targetPort: 7124  # Puerto real del pod
  selector:
    app: new-api
  type: NodePort

---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: new-api-hpa
  namespace: default
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: new-api
  minReplicas: 2
  maxReplicas: 10
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
