apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: new-api
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/castilla204/newapi.git
    targetRevision: main
    path: k8s
    directory:
      recurse: true
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false
    syncOptions:
    - CreateNamespace=false
    - PrunePropagationPolicy=foreground
    - PruneLast=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
  ignoreDifferences:
  - group: external-secrets.io
    kind: ExternalSecret
    name: newapi-secrets
    jsonPointers:
    - /metadata/annotations
  - group: ""
    kind: Secret
    name: newapi-secrets
    jsonPointers:
    - /data
