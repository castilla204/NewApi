name: Auto Merge

on:
  workflow_run:
    workflows: ["CI/CD Pipeline"]
    types:
      - completed
    branches:
      - '**'  # Trigger on all branches

permissions:
  contents: write
  pull-requests: write
  checks: read

jobs:
  auto-merge:
    name: Auto Merge PR
    runs-on: ubuntu-latest
    # Solo ejecutar si el workflow_run fue exitoso y NO es un merge commit
    if: |
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event != 'pull_request' ||
      (github.event.workflow_run.event == 'pull_request' &&
       !contains(github.event.workflow_run.head_commit.message, 'Merge pull request'))
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Find PR
        id: find-pr
        uses: actions/github-script@v7
        with:
          script: |
            const workflowRun = github.event.workflow_run;
            const headBranch = workflowRun.head_branch;
            const headSha = workflowRun.head_sha;
            
            console.log(`Looking for PR with branch: ${headBranch}, SHA: ${headSha}`);
            
            // Buscar PRs abiertos que coincidan con el branch
            const { data: prs } = await github.rest.pulls.list({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              head: `${context.repo.owner}:${headBranch}`,
            });
            
            console.log(`Found ${prs.length} open PR(s) for branch ${headBranch}`);
            
            if (prs.length === 0) {
              console.log('No PR found, skipping');
              core.setOutput('pr-number', '');
              core.setOutput('found', 'false');
              return;
            }
            
            // Buscar el PR que coincida con el SHA
            const matchingPR = prs.find(pr => pr.head.sha === headSha);
            
            if (!matchingPR) {
              console.log('No PR found matching the SHA, skipping');
              core.setOutput('pr-number', '');
              core.setOutput('found', 'false');
              return;
            }
            
            console.log(`Found PR #${matchingPR.number}: ${matchingPR.title}`);
            console.log(`  User: ${matchingPR.user.login} (${matchingPR.user.type})`);
            console.log(`  Mergeable: ${matchingPR.mergeable}`);
            console.log(`  Mergeable state: ${matchingPR.mergeable_state}`);
            
            // Solo procesar PRs de bots
            if (matchingPR.user.type !== 'Bot' && !matchingPR.user.login.includes('bot')) {
              console.log('PR is not from a bot, skipping');
              core.setOutput('pr-number', '');
              core.setOutput('found', 'false');
              return;
            }
            
            core.setOutput('pr-number', matchingPR.number.toString());
            core.setOutput('found', 'true');
            core.setOutput('head-sha', matchingPR.head.sha);

      - name: Wait for PR to be mergeable
        if: steps.find-pr.outputs.found == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const prNumber = parseInt('${{ steps.find-pr.outputs.pr-number }}');
            const maxWait = 300; // 5 minutos
            const checkInterval = 10;
            let waited = 0;
            
            console.log(`Waiting for PR #${prNumber} to be mergeable...`);
            
            while (waited < maxWait) {
              const { data: pr } = await github.rest.pulls.get({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: prNumber,
              });
              
              // Si el PR está cerrado, salir
              if (pr.state !== 'open') {
                console.log(`PR #${prNumber} is ${pr.state}, stopping`);
                core.setFailed('PR is no longer open');
                return;
              }
              
              // Verificar que es mergeable
              if (pr.mergeable === true && pr.mergeable_state === 'clean') {
                console.log(`✅ PR #${prNumber} is mergeable and ready`);
                break;
              }
              
              if (pr.mergeable === false || pr.mergeable_state === 'dirty' || pr.mergeable_state === 'blocked') {
                console.log(`PR #${prNumber} cannot be merged: mergeable=${pr.mergeable}, state=${pr.mergeable_state}`);
                core.setFailed('PR cannot be merged');
                return;
              }
              
              console.log(`⏳ Waiting... (${waited}s/${maxWait}s) - mergeable=${pr.mergeable}, state=${pr.mergeable_state}`);
              await new Promise(resolve => setTimeout(resolve, checkInterval * 1000));
              waited += checkInterval;
            }
            
            if (waited >= maxWait) {
              core.setFailed('Timeout waiting for PR to be mergeable');
              return;
            }

      - name: Wait for all checks to pass
        if: steps.find-pr.outputs.found == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const prNumber = parseInt('${{ steps.find-pr.outputs.pr-number }}');
            const headSha = '${{ steps.find-pr.outputs.head-sha }}';
            const maxWait = 300;
            const checkInterval = 10;
            let waited = 0;
            
            console.log(`Waiting for all checks to pass for PR #${prNumber}...`);
            
            while (waited < maxWait) {
              // Verificar estado combinado
              const { data: status } = await github.rest.repos.getCombinedStatusForRef({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: headSha,
              });
              
              // Verificar checks
              const { data: checks } = await github.rest.checks.listForRef({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: headSha,
              });
              
              // Verificar PR
              const { data: pr } = await github.rest.pulls.get({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: prNumber,
              });
              
              if (pr.state !== 'open') {
                console.log(`PR #${prNumber} is ${pr.state}, stopping`);
                core.setFailed('PR is no longer open');
                return;
              }
              
              const allChecksPassed = 
                status.state === 'success' &&
                checks.check_runs.every(check => 
                  check.status === 'completed' && 
                  (check.conclusion === 'success' || check.conclusion === 'skipped')
                ) &&
                pr.mergeable === true &&
                pr.mergeable_state === 'clean' &&
                !pr.draft;
              
              if (allChecksPassed) {
                console.log('✅ All checks passed, ready to merge');
                break;
              }
              
              if (status.state === 'failure' || pr.mergeable === false) {
                console.log(`Checks failed or PR not mergeable`);
                core.setFailed('Checks failed or PR is not mergeable');
                return;
              }
              
              console.log(`⏳ Waiting... (${waited}s/${maxWait}s) - Status: ${status.state}`);
              await new Promise(resolve => setTimeout(resolve, checkInterval * 1000));
              waited += checkInterval;
            }
            
            if (waited >= maxWait) {
              core.setFailed('Timeout waiting for checks');
              return;
            }

      - name: Merge PR
        if: steps.find-pr.outputs.found == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const prNumber = parseInt('${{ steps.find-pr.outputs.pr-number }}');
            
            console.log(`=== MERGING PR #${prNumber} ===`);
            
            // Verificar una última vez
            const { data: pr } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: prNumber,
            });
            
            if (pr.state !== 'open') {
              console.log(`PR #${prNumber} is already ${pr.state}`);
              return;
            }
            
            if (pr.mergeable !== true || pr.mergeable_state !== 'clean') {
              console.log(`PR #${prNumber} is not ready to merge`);
              core.setFailed('PR is not ready to merge');
              return;
            }
            
            try {
              const result = await github.rest.pulls.merge({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: prNumber,
                merge_method: 'squash',
              });
              
              console.log('✅✅✅ PR MERGED SUCCESSFULLY ✅✅✅');
              console.log(`   SHA: ${result.data.sha}`);
            } catch (error) {
              console.error('Error merging PR:', error.message);
              if (error.status === 405) {
                core.setFailed('PR cannot be merged');
              } else {
                throw error;
              }
            }
