
name: Docker Build and Push

on:
  push:
    branches:
      - main  # Si tu rama principal es 'master', cámbialo por 'master'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Comprobar el repositorio
        uses: actions/checkout@v4

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Cachear capas de Docker
        uses: actions/cache@v4
        with:
          path: ~/.cache/docker
          key: ${{ runner.os }}-build-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-build-

      - name: Iniciar sesión en Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Construir y subir la imagen de Docker
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/newapi:latest  # Cambia 'nombre-del-repo' por el nombre de tu repositorio en Docker Hub
