apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: newapi-secrets
  namespace: default
  finalizers:
  - externalsecrets.external-secrets.io/externalsecret-cleanup
spec:
  refreshInterval: 5m0s
  secretStoreRef:
    kind: ClusterSecretStore
    name: gcp-secret-manager
  target:
    creationPolicy: Owner
    deletionPolicy: Retain
    name: newapi-secrets
    template:
      engineVersion: v2
      mergePolicy: Replace
      metadata:
        labels:
          app: newapi
          managed-by: external-secrets
  data:
  - remoteRef:
      key: postgres-username
    secretKey: postgres-username
  - remoteRef:
      key: postgres-password
    secretKey: postgres-password
  - remoteRef:
      key: postgres-host
    secretKey: postgres-host
  - remoteRef:
      key: postgres-port
    secretKey: postgres-port
  - remoteRef:
      key: postgres-database
    secretKey: postgres-database
  - remoteRef:
      key: jwt-key
    secretKey: jwt-key
  - remoteRef:
      key: jwt-issuer
    secretKey: jwt-issuer
  - remoteRef:
      key: jwt-audience
    secretKey: jwt-audience
  - remoteRef:
      key: rabbitmq-password
    secretKey: rabbitmq-password
  - remoteRef:
      key: google-client-ids
    secretKey: google-client-ids
  - remoteRef:
      key: openai-api-key
    secretKey: openai-api-key
  - remoteRef:
      key: email-from-email
    secretKey: email-from-email
  - remoteRef:
      key: email-from-name
    secretKey: email-from-name
  - remoteRef:
      key: email-smtp-host
    secretKey: email-smtp-host
  - remoteRef:
      key: email-smtp-password
    secretKey: email-smtp-password
  - remoteRef:
      key: email-smtp-port
    secretKey: email-smtp-port
  - remoteRef:
      key: email-smtp-username
    secretKey: email-smtp-username
  - remoteRef:
      key: stripe-secret-key
    secretKey: stripe-secret-key
  - remoteRef:
      key: stripe-webhook-secret
    secretKey: stripe-webhook-secret
  - remoteRef:
      key: stripe-general-webhook-secret
    secretKey: stripe-general-webhook-secret
  - remoteRef:
      key: twilio-account-sid
    secretKey: twilio-account-sid
  - remoteRef:
      key: twilio-auth-token
    secretKey: twilio-auth-token
  - remoteRef:
      key: twilio-verification-service-sid
    secretKey: twilio-verification-service-sid
