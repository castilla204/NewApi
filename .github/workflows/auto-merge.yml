name: Auto Merge

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  check_suite:
    types: [completed]
  status: {}

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    name: Auto Merge PR
    runs-on: ubuntu-latest
    # Solo para PRs de bots (Renovate, Dependabot, etc.)
    if: |
      github.event.pull_request.user.type == 'Bot' ||
      contains(github.event.pull_request.user.login, 'bot') ||
      github.event.pull_request.user.login == 'renovate[bot]' ||
      github.event.pull_request.user.login == 'dependabot[bot]'
    steps:
      - name: Get PR info
        id: pr-info
        uses: actions/github-script@v7
        with:
          script: |
            const { data: pr } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number,
            });
            
            core.setOutput('mergeable', pr.mergeable);
            core.setOutput('mergeable_state', pr.mergeable_state);
            core.setOutput('draft', pr.draft);
            
            return {
              mergeable: pr.mergeable,
              mergeable_state: pr.mergeable_state,
              draft: pr.draft
            };

      - name: Check if PR is ready
        if: steps.pr-info.outputs.draft == 'false' && steps.pr-info.outputs.mergeable == 'true'
        run: |
          echo "PR is ready for merge check"
          echo "Mergeable state: ${{ steps.pr-info.outputs.mergeable_state }}"

      - name: Wait for CI/CD to complete
        if: steps.pr-info.outputs.draft == 'false' && steps.pr-info.outputs.mergeable == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const maxWait = 600; // 10 minutos
            const checkInterval = 15; // Verificar cada 15 segundos
            let waited = 0;

            while (waited < maxWait) {
              const { data: pr } = await github.rest.pulls.get({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: context.issue.number,
              });

              // Verificar estado de checks
              const { data: status } = await github.rest.repos.getCombinedStatusForRef({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: pr.head.sha,
              });

              const { data: checks } = await github.rest.checks.listForRef({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: pr.head.sha,
              });

              // Verificar que todos los checks pasaron
              const allChecksPassed = 
                status.state === 'success' &&
                checks.check_runs.every(check => 
                  check.status === 'completed' && 
                  (check.conclusion === 'success' || check.conclusion === 'skipped')
                );

              if (allChecksPassed && pr.mergeable && !pr.draft) {
                console.log('✅ All checks passed, PR is ready to merge');
                break;
              }

              if (status.state === 'failure') {
                core.setFailed('CI/CD checks failed');
                return;
              }

              console.log(`⏳ Waiting for checks... (${waited}s/${maxWait}s)`);
              console.log(`   Status: ${status.state}`);
              console.log(`   Checks: ${checks.check_runs.length} total`);
              
              await new Promise(resolve => setTimeout(resolve, checkInterval * 1000));
              waited += checkInterval;
            }

            if (waited >= maxWait) {
              core.setFailed('Timeout waiting for checks to complete');
              return;
            }

      - name: Merge PR
        if: steps.pr-info.outputs.draft == 'false' && steps.pr-info.outputs.mergeable == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            try {
              const result = await github.rest.pulls.merge({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: context.issue.number,
                merge_method: 'squash',
                commit_title: `${{ github.event.pull_request.title }} (#${{ github.event.pull_request.number }})`,
              });
              
              console.log('✅ PR merged successfully');
              console.log(`   SHA: ${result.data.sha}`);
            } catch (error) {
              if (error.status === 405) {
                console.log('⚠️ PR cannot be merged (may require manual merge)');
                core.setFailed('PR merge failed - may need manual intervention');
              } else {
                throw error;
              }
            }
