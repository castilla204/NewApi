name: CI/CD Pipeline

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'k8s/deployment.yaml'
  pull_request:
    branches:
      - main
    paths-ignore:
      - 'k8s/deployment.yaml'
  workflow_dispatch:

jobs:
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest
    # NO ejecutar en PRs de renovate/dependabot para ahorrar costos
    if: |
      github.event_name != 'pull_request' ||
      (github.event.pull_request.user.login != 'renovate[bot]' &&
       github.event.pull_request.user.login != 'dependabot[bot]' &&
       !startsWith(github.event.pull_request.head.ref, 'renovate/') &&
       !startsWith(github.event.pull_request.head.ref, 'dependabot/'))
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        run: dotnet restore newApi.csproj

      - name: Build
        run: dotnet build newApi.csproj --configuration Release --no-restore

      - name: Run tests
        run: dotnet test --no-build --configuration Release --verbosity normal || echo "No tests found"
        continue-on-error: true

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: build-and-test
    # NO ejecutar en PRs de renovate/dependabot para ahorrar costos
    if: |
      (github.event_name != 'pull_request' ||
       (github.event.pull_request.user.login != 'renovate[bot]' &&
        github.event.pull_request.user.login != 'dependabot[bot]' &&
        !startsWith(github.event.pull_request.head.ref, 'renovate/') &&
        !startsWith(github.event.pull_request.head.ref, 'dependabot/'))) &&
      always() &&
      (needs.build-and-test.result == 'success' || needs.build-and-test.result == 'skipped')
    permissions:
      contents: read
      security-events: write
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Run Trivy vulnerability scanner (table format)
        uses: aquasecurity/trivy-action@0.33.1
        id: trivy-scan
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'table'
          severity: 'CRITICAL,HIGH'
          exit-code: '1'
          scanners: 'vuln'
          skip-files: 'Program.cs'

  docker-build:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    needs: [build-and-test, security-scan]
    if: |
      github.event_name == 'push' && 
      github.ref == 'refs/heads/main' &&
      (needs.security-scan.result == 'success' || needs.security-scan.result == 'skipped')
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            erizo9/newapi:latest
            erizo9/newapi:${{ github.sha }}
          cache-from: type=registry,ref=erizo9/newapi:buildcache
          cache-to: type=registry,ref=erizo9/newapi:buildcache,mode=max
