name: Auto Merge

on:
  workflow_run:
    workflows: ["CI/CD Pipeline"]
    types:
      - completed

permissions:
  contents: write
  pull-requests: write
  checks: read

jobs:
  auto-merge:
    name: Auto Merge PR
    runs-on: ubuntu-latest
    # Verificar que el evento existe y fue exitoso
    if: |
      github.event_name == 'workflow_run' &&
      github.event.workflow_run != null &&
      github.event.workflow_run.conclusion == 'success'
    steps:
      - name: Find and merge PR
        uses: actions/github-script@v7
        with:
          script: |
            // Validación segura del evento
            if (!github.event || !github.event.workflow_run) {
              console.log('ERROR: github.event.workflow_run is not available');
              console.log('github.event:', JSON.stringify(github.event, null, 2));
              core.setFailed('Workflow run event is not available');
              return;
            }
            
            const workflowRun = github.event.workflow_run;
            const headBranch = workflowRun.head_branch;
            const headSha = workflowRun.head_sha;
            const conclusion = workflowRun.conclusion;
            
            console.log(`=== AUTO MERGE ===`);
            console.log(`Branch: ${headBranch || 'N/A'}`);
            console.log(`SHA: ${headSha || 'N/A'}`);
            console.log(`Event: ${workflowRun.event || 'N/A'}`);
            console.log(`Conclusion: ${conclusion || 'N/A'}`);
            
            // Verificar que fue exitoso
            if (conclusion !== 'success') {
              console.log(`Skipping: Workflow run conclusion is '${conclusion}', not 'success'`);
              return;
            }
            
            // NO procesar si es un merge commit
            if (workflowRun.head_commit?.message?.includes('Merge pull request')) {
              console.log('Skipping: This is a merge commit');
              return;
            }
            
            // NO procesar si es push a main (no es un PR)
            if (workflowRun.event === 'push' && headBranch === 'main') {
              console.log('Skipping: This is a push to main, not a PR');
              return;
            }
            
            if (!headBranch) {
              console.log('Skipping: No head branch found');
              return;
            }
            
            // Buscar PRs abiertos
            let prs = [];
            try {
              const response = await github.rest.pulls.list({
                owner: context.repo.owner,
                repo: context.repo.repo,
                state: 'open',
                head: `${context.repo.owner}:${headBranch}`,
              });
              prs = response.data;
            } catch (error) {
              console.error('Error searching PRs:', error.message);
              core.setFailed(`Error searching PRs: ${error.message}`);
              return;
            }
            
            console.log(`Found ${prs.length} open PR(s) for branch ${headBranch}`);
            
            if (prs.length === 0) {
              console.log('No PR found, skipping');
              return;
            }
            
            // Buscar PR que coincida con el SHA
            const pr = prs.find(p => p.head.sha === headSha);
            
            if (!pr) {
              console.log('No PR found matching the SHA, skipping');
              return;
            }
            
            console.log(`Found PR #${pr.number}: ${pr.title}`);
            console.log(`  User: ${pr.user.login} (${pr.user.type})`);
            console.log(`  Base branch: ${pr.base.ref}`);
            console.log(`  Head branch: ${pr.head.ref}`);
            
            // ✅ SOLO mergear PRs que apunten a 'main'
            if (pr.base.ref !== 'main' && pr.base.ref !== 'master') {
              console.log(`Skipping: PR targets branch '${pr.base.ref}', not 'main' or 'master'`);
              return;
            }
            
            // Solo procesar PRs de bots
            if (pr.user.type !== 'Bot' && !pr.user.login.includes('bot')) {
              console.log('Skipping: PR is not from a bot');
              return;
            }
            
            console.log(`✅ PR #${pr.number} is from bot and targets 'main' - proceeding to merge`);
            
            // Esperar a que sea mergeable (máximo 5 minutos)
            console.log('Waiting for PR to be mergeable...');
            let mergeable = false;
            for (let i = 0; i < 30; i++) {
              const { data: prCheck } = await github.rest.pulls.get({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: pr.number,
              });
              
              if (prCheck.state !== 'open') {
                console.log(`PR #${pr.number} is ${prCheck.state}, stopping`);
                return;
              }
              
              // Verificar que sigue apuntando a main
              if (prCheck.base.ref !== 'main' && prCheck.base.ref !== 'master') {
                console.log(`PR #${pr.number} base branch changed to '${prCheck.base.ref}', stopping`);
                return;
              }
              
              if (prCheck.mergeable === true && prCheck.mergeable_state === 'clean') {
                mergeable = true;
                console.log('✅ PR is mergeable');
                break;
              }
              
              if (prCheck.mergeable === false || prCheck.mergeable_state === 'dirty' || prCheck.mergeable_state === 'blocked') {
                console.log(`PR cannot be merged: mergeable=${prCheck.mergeable}, state=${prCheck.mergeable_state}`);
                return;
              }
              
              console.log(`⏳ Waiting... (${i * 10}s) - mergeable=${prCheck.mergeable}, state=${prCheck.mergeable_state}`);
              await new Promise(resolve => setTimeout(resolve, 10000));
            }
            
            if (!mergeable) {
              console.log('Timeout: PR did not become mergeable');
              return;
            }
            
            // Verificar checks (máximo 5 minutos)
            console.log('Waiting for all checks to pass...');
            const headShaCheck = pr.head.sha;
            let checksPassed = false;
            
            for (let i = 0; i < 30; i++) {
              const { data: status } = await github.rest.repos.getCombinedStatusForRef({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: headShaCheck,
              });
              
              const { data: checks } = await github.rest.checks.listForRef({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: headShaCheck,
              });
              
              const { data: prCheck } = await github.rest.pulls.get({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: pr.number,
              });
              
              if (prCheck.state !== 'open') {
                console.log(`PR #${pr.number} is ${prCheck.state}, stopping`);
                return;
              }
              
              // Verificar que sigue apuntando a main
              if (prCheck.base.ref !== 'main' && prCheck.base.ref !== 'master') {
                console.log(`PR #${pr.number} base branch changed, stopping`);
                return;
              }
              
              const allPassed = 
                status.state === 'success' &&
                checks.check_runs.every(c => 
                  c.status === 'completed' && 
                  (c.conclusion === 'success' || c.conclusion === 'skipped')
                ) &&
                prCheck.mergeable === true &&
                prCheck.mergeable_state === 'clean';
              
              if (allPassed) {
                checksPassed = true;
                console.log('✅ All checks passed');
                break;
              }
              
              if (status.state === 'failure' || prCheck.mergeable === false) {
                console.log('Checks failed or PR not mergeable');
                return;
              }
              
              console.log(`⏳ Waiting for checks... (${i * 10}s) - Status: ${status.state}`);
              await new Promise(resolve => setTimeout(resolve, 10000));
            }
            
            if (!checksPassed) {
              console.log('Timeout: Checks did not pass');
              return;
            }
            
            // Mergear
            console.log(`=== MERGING PR #${pr.number} ===`);
            
            // Verificación final
            const { data: prFinal } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: pr.number,
            });
            
            if (prFinal.state !== 'open') {
              console.log(`PR #${pr.number} is already ${prFinal.state}`);
              return;
            }
            
            if (prFinal.base.ref !== 'main' && prFinal.base.ref !== 'master') {
              console.log(`PR #${pr.number} base branch is '${prFinal.base.ref}', not 'main'`);
              return;
            }
            
            if (prFinal.mergeable !== true || prFinal.mergeable_state !== 'clean') {
              console.log(`PR #${pr.number} is not ready to merge`);
              return;
            }
            
            try {
              const result = await github.rest.pulls.merge({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: pr.number,
                merge_method: 'squash',
              });
              
              console.log('✅✅✅ PR MERGED SUCCESSFULLY ✅✅✅');
              console.log(`   SHA: ${result.data.sha}`);
              console.log(`   Base branch: ${prFinal.base.ref}`);
            } catch (error) {
              console.error(`Error merging PR: ${error.message}`);
              if (error.status === 405) {
                console.log('PR cannot be merged - may need manual intervention');
              } else {
                throw error;
              }
            }
